appId: com.orcastrator.app
productName: Orca-Strator
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/controller
    to: controller
  - from: resources/ui
    to: ui
  - from: resources/build-info.json
    to: build-info.json
  - from: resources/controller-safety.ps1
    to: controller-safety.ps1
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  # No signing certificate is configured; artifacts are truthfully UNSIGNED.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
electronLanguages:
  - en-US
