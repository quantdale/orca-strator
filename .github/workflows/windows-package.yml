name: Windows package build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build unpacked package
        run: npm run package:win

      - name: Build installer
        run: npm run package:win:installer

      # Hosted CI cannot execute a full interactive desktop smoke; the artifact
      # is therefore labeled PACKAGE_BUILT, never PACKAGE_RUNTIME_QUALIFIED.
      - name: Upload unpacked artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-strator-win-unpacked-x64
          path: apps/desktop/release/win-unpacked/
          retention-days: 14

      - name: Upload installer artifact (UNSIGNED)
        uses: actions/upload-artifact@v4
        with:
          name: orca-strator-win-installer-x64-unsigned
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-failure-logs
          path: |
            apps/desktop/resources/.deps-install/npm-debug.log
            apps/controller/logs
          if-no-files-found: ignore
          retention-days: 7
